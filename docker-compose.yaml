version: '3.8'

services:
  app:
    image: ${BLOG_PLATFORM_IMAGE:-berlin16/blog-platform:latest}
    container_name: blog-platform
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DSN: ${DSN:?DSN must be set}
    depends_on:
      - db
    networks:
      - blog-net

  db:
    image: mysql:8.0
    container_name: blog-stats-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: blog_db
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - blog-net

networks:
  blog-net:
    driver: bridge
